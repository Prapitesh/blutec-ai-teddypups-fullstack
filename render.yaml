databases:
  - name: blutec-teddypups-db
    plan: free
    databaseName: blutec_teddypups
    user: blutec

services:
  - type: web
    name: blutec-teddypups
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/puppies
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70
      - key: DATABASE_URL
        fromDatabase:
          name: blutec-teddypups-db
          property: connectionString
